[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geocaching-cli"
version = "0.1.0"
description = "Offline-first personal Geocaching CLI (GPX/Pocket Query + optional pycaching live commands)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "geocaching-cli contributors" }]
keywords = ["geocaching", "gpx", "pocket-query", "cli"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pycaching>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
gc = "geocaching_cli.cli:main"
geocaching-cli = "geocaching_cli.cli:main"

[project.urls]
Homepage = "https://github.com/zzzzzyc/geocaching-cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
